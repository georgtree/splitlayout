name: Build and test splitlayout
description: Run the GUI suite with Tcl/Tk 9.1.0
inputs:
  toolchain:
    description: linux-gcc, windows-ucrt64, or windows-msvc
    required: true
  packages:
    description: Resolved argparse release assets for this toolchain
    required: true
  make-dist:
    description: Create a distribution archive after tests pass
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: tcltk/tcl
        ref: core-9-1-0
        path: _ci/tcl
    - uses: actions/checkout@v4
      with:
        repository: tcltk/tk
        ref: core-9-1-0
        path: _ci/tk
    - uses: actions/checkout@v4
      with:
        repository: tcltk/tklib
        ref: tklib-0.9
        path: _ci/tklib
    - uses: actions/checkout@v4
      with:
        repository: tcltk/tcllib
        ref: tcllib-2-0
        path: _ci/tcllib
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Cache argparse release
      id: argparse
      uses: actions/cache@v4
      with:
        path: _ci/argparse
        key: splitlayout-release-v1-argparse-${{ inputs.toolchain }}-${{ fromJSON(inputs.packages).argparse.key }}
    - if: steps.argparse.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: python .github/scripts/release-deps.py argparse
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth libx11-dev libxft-dev libxss-dev libxext-dev libharfbuzz-dev
    - if: inputs.toolchain == 'windows-ucrt64'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: make zip tar git mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
    - if: inputs.toolchain == 'windows-msvc'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Identify Tcl cache inputs
      id: key
      shell: ${{ inputs.toolchain == 'windows-ucrt64' && 'msys2 {0}' || 'bash' }}
      run: python .github/scripts/tcl-cache-key.py '${{ inputs.toolchain }}'
    - name: Restore Tcl/Tk runtime
      id: runtime
      uses: actions/cache@v4
      with:
        path: _ci/runtime
        key: ${{ steps.key.outputs.runtime }}
    - name: Enable Windows test crash diagnostics
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Print each test body start and each completed pass, plus normal failure details.
        'TESTFLAGS=-verbose tpbe' >> $env:GITHUB_ENV
        $dir = Join-Path $env:RUNNER_TEMP 'splitlayout-dumps'
        New-Item -ItemType Directory -Path $dir -Force | Out-Null
        $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\tclsh91.exe'
        New-Item -Path $key -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dir -Force | Out-Null
        New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
    - if: inputs.toolchain != 'windows-msvc'
      shell: ${{ inputs.toolchain == 'windows-ucrt64' && 'msys2 {0}' || 'bash' }}
      env:
        RUNTIME_CACHE_HIT: ${{ steps.runtime.outputs.cache-hit }}
        MAKE_DIST: ${{ inputs.make-dist }}
      run: bash .github/scripts/build-tea.sh
    - if: inputs.toolchain == 'windows-msvc'
      shell: pwsh
      env:
        RUNTIME_CACHE_HIT: ${{ steps.runtime.outputs.cache-hit }}
        MAKE_DIST: ${{ inputs.make-dist }}
      run: ./.github/scripts/build-msvc.ps1
    - name: Preserve Windows test crash evidence
      if: failure() && runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: test-crash-${{ inputs.toolchain }}-${{ github.run_attempt }}
        path: |
          _ci/layout-build/test.log
          ${{ runner.temp }}/splitlayout-dumps/*.dmp
        if-no-files-found: ignore
        retention-days: 7
